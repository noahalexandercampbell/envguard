[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard"
version = "0.1.0"
description = "Environment variable guard for local builds and CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML"]

[project.urls]
Repository = "https://github.com/noahalexandercampbell/envguard"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
envguard = "envguard.cli:main"

[tool.setuptools.packages.find]
include = ["envguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I"]
